<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="../modern-normalize.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="buscar.css" />
  </head>
  <body>
    <header>
      <a href="../../public/index.html">
        <img src="../assets/flechaIzquierda.svg" alt="flechaIzquierda" />
        Volver
      </a>
      <div class="header-title">
        <h1>Buscar Profesionales</h1>
        <span>Encuentra el trabajador perfecto para tu proyecto</span>
      </div>
    </header>

    <main>
      <div class="div-busqueda">
        <label for="input-buscar">
          <svg
            class="lupa-svg"
            width="800px"
            height="800px"
            viewBox="0 0 1024 1024"
            class="icon"
            version="1.1"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M448 768A320 320 0 1 0 448 128a320 320 0 0 0 0 640z m297.344-76.992l214.592 214.592-54.336 54.336-214.592-214.592a384 384 0 1 1 54.336-54.336z"
            />
          </svg>
          <input
            type="text"
            id="input-buscar"
            placeholder="Buscar por nombre, oficio o habilidades"
          />
        </label>
        <label for="select-filtro" class="select-filtro">
          <svg
            width="800px"
            height="800px"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M3 4.6C3 4.03995 3 3.75992 3.10899 3.54601C3.20487 3.35785 3.35785 3.20487 3.54601 3.10899C3.75992 3 4.03995 3 4.6 3H19.4C19.9601 3 20.2401 3 20.454 3.10899C20.6422 3.20487 20.7951 3.35785 20.891 3.54601C21 3.75992 21 4.03995 21 4.6V6.33726C21 6.58185 21 6.70414 20.9724 6.81923C20.9479 6.92127 20.9075 7.01881 20.8526 7.10828C20.7908 7.2092 20.7043 7.29568 20.5314 7.46863L14.4686 13.5314C14.2957 13.7043 14.2092 13.7908 14.1474 13.8917C14.0925 13.9812 14.0521 14.0787 14.0276 14.1808C14 14.2959 14 14.4182 14 14.6627V17L10 21V14.6627C10 14.4182 10 14.2959 9.97237 14.1808C9.94787 14.0787 9.90747 13.9812 9.85264 13.8917C9.7908 13.7908 9.70432 13.7043 9.53137 13.5314L3.46863 7.46863C3.29568 7.29568 3.2092 7.2092 3.14736 7.10828C3.09253 7.01881 3.05213 6.92127 3.02763 6.81923C3 6.70414 3 6.58185 3 6.33726V4.6Z"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <select name="oficio" id="select-filtro">
            <option value="" selected>Todos los oficios</option>
            <option value="carpintero">Carpintero/a</option>
            <option value="electricista">Electricista</option>
            <option value="plomero">Plomero/a</option>
            <option value="pintor">Pintor/a</option>
            <option value="albañil">Albañil</option>
            <option value="gasista">Gasista</option>
            <option value="jardinero">Jardinero/a</option>
            <option value="techista">Techista</option>
          </select>
        </label>
      </div>

      <div class="div-oficios-cards" id="div-oficios-cards">
        <span id="cantidad-profesionales">29 Profesionales encontrados</span>
      </div>
    </main>

    <footer class="footer-main">
      <a href="">Terminos y Condiciones</a>
      <a href="">Contacto</a>
    </footer>

    <script src="../js/profesionalVerificadoCard.js"></script>
  </body>
</html>
